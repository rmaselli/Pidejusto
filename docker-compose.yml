services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pidejusto
      POSTGRES_PASSWORD: pidejusto
      POSTGRES_DB: pidejusto
    ports:
      - "5432:5432"
    volumes:
      - pj_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pidejusto -d pidejusto"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://pidejusto:pidejusto@db:5432/pidejusto
      API_PORT: 4000
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      SESSION_SECRET: ${SESSION_SECRET:-dev-compose-secret-change-me}
      AUTH_MODE: ${AUTH_MODE:-demo}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-http://localhost:4000/auth/callback}
      SAP_PROVIDER: ${SAP_PROVIDER:-mock}
      SAP_BASE_URL: ${SAP_BASE_URL:-}
      SAP_COMPANY_DB: ${SAP_COMPANY_DB:-}
      SAP_USERNAME: ${SAP_USERNAME:-}
      SAP_PASSWORD: ${SAP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pj_pg:
