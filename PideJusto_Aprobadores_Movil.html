/* tarjetas y etiquetas (estilo “Línea gráfica digital”) */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;border:1px solid var(--line)}

.sect-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--okbg);color:#0a5a2a} .chip.warn{background:var(--warnbg);color:#7a5a08}
.chip.bad{background:var(--dangerbg);color:var(--danger)} .chip.info{background:var(--infobg);color:var(--g800)}
.chip.dark{background:var(--g900);color:#fff} .chip.lima{background:var(--lima);color:var(--g900)}
:root[data-theme=dark] .chip.ok{color:#9be3b0} :root[data-theme=dark] .chip.warn{color:#f0d488} :root[data-theme=dark] .chip.bad{color:#ffb4a6} :root[data-theme=dark] .chip.info{color:#bfe0d2}

/* botones */
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(.97)} .btn:active{transform:scale(.98)} .btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--lima);color:var(--g900)} .btn.d{background:var(--g800);color:#fff} .btn.bad{background:var(--danger);color:#fff}
.btn.claude{background:linear-gradient(135deg,var(--g800),var(--g700));color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)} .btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:14px}
.ico{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* formularios */
label.f{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;outline:none}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .row>.grow{flex:1;min-width:140px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px}
.kpi{background:var(--soft2);border-radius:14px;padding:11px 13px;border:1px solid var(--line)}

/* medidores y barras */

/* tablas */

tr.clk{cursor:pointer} tr.clk:hover td{background:var(--soft2)}

/* pasos (seguimiento) */

.bit>div{padding:5px 0;font-size:12.5px} .bit .w{font-size:11px;color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:26px 10px}
.code{background:var(--g900);color:#dff0d0;border-radius:12px;padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;overflow:auto;white-space:pre}

<script>/* ============================================================
   Pide Justo · Núcleo compartido (datos, reglas, contabilidad, Claude)
   Lo usan la app de escritorio y la app móvil de aprobadores.
   ============================================================ */
(function (G) {
'use strict';

const LS_KEY = 'pidejusto.v3.state';
const ABIERTOS = ['Pendiente N1', 'Pendiente N2', 'Aprobada'];               // evitan pedir dos veces lo mismo
const COMPROMETEN = ['Pendiente N1', 'Pendiente N2', 'Aprobada', 'Enviada a SAP']; // comprometen presupuesto
const POST_COLS = ['DocNum','DocDate','RequiredDate','Requester','Empresa','ItemCode','ItemDescription','Quantity',
  'WarehouseCode','AccountCode','NombreCuenta','CostingCode','CostingCode2','CostingCode3','CostingCode4','CostingCode5',
  'ProjectCode','UnitPrice_Q','LineTotal_Q','TipoDocRespaldo','DetalleCompra','PlacaVehiculo','ObraEnProceso',
  'NoObraEspecifica','Validacion','SolicitudesOrigen','Comments'];

/* ---------- utilidades ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fQ = n => 'Q ' + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fN = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 0});
const fP = n => (Number(n || 0) * 100).toFixed(0) + '%';
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const pad = (n, w) => String(n).padStart(w, '0');
const fDT = iso => { if (!iso) return '—'; const d = new Date(iso); return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear()+' '+pad(d.getHours(),2)+':'+pad(d.getMinutes(),2); };
const fD = iso => { if (!iso) return '—'; const d = new Date(iso); return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear(); };
const isoDay = d => d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoDay(d); };
const roundUp = x => Math.ceil(Number((+x).toPrecision(12)));   // ROUNDUP(x,0) de Excel sin ruido de coma flotante
function durTxt(ms) {
  if (ms == null || isNaN(ms)) return '—';
  const m = ms / 60000;
  if (m < 1) return '< 1 min';
  if (m < 90) return Math.round(m) + ' min';
  const h = m / 60; if (h < 48) return h.toFixed(1) + ' h';
  return (h / 24).toFixed(1) + ' días';
}

/* ---------- modelo a partir de datos (embebidos o de un Excel cargado) ---------- */
function calcMinMax(c, lt, p, P) {
  const n = c.length, pos = c.filter(v => v > 0).length;
  const clase = pos >= 3 ? 'Regular' : pos === 2 ? 'Intermitente' : 'Esporádico';
  const avg = c.reduce((a, b) => a + b, 0) / n;
  const sd = n > 1 ? Math.sqrt(c.reduce((a, b) => a + (b - avg) ** 2, 0) / (n - 1)) : 0;
  const L = lt || P.ltStd, spor = clase === 'Esporádico';
  const dd = avg / P.dias;
  const ss = spor ? 0 : P.Z * sd * Math.sqrt(L / P.dias);
  const min = spor ? 0 : roundUp(dd * L + ss);
  const max = spor ? 0 : roundUp(min + avg * P.meses / 3);
  return {clase, avg, sd, min, max, lt: L, presup: avg * p * (1 + P.ajuste / 100)};
}

function buildModel(D) {
  const M = {D, params: D.params, empresas: D.emp.map(e => ({k: e[0], anexo: e[1]}))};
  M.anexoOf = Object.fromEntries(M.empresas.map(e => [e.k, e.anexo]));
  M.art = D.art.map(r => ({e: r[0], c: r[1], n: r[2], cat: r[3], area: r[4], abc: r[5], p: r[6] || 0, lt: r[7], corp: r[8], key: r[0] + '|' + r[1]}));
  M.artBy = new Map(M.art.map(a => [a.key, a]));
  M.stock = new Map(D.exi.map(r => [r[0] + '|' + r[1], {ex: r[2] || 0, ped: r[3] || 0, com: r[4] || 0}]));
  M.cons = new Map(D.con.map(r => [r[0] + '|' + r[1], [r[2] || 0, r[3] || 0, r[4] || 0, r[5] || 0]]));
  M.mm = new Map();
  M.presup = new Map();
  for (const a of M.art) {
    const mm = calcMinMax(M.cons.get(a.key) || [0, 0, 0, 0], a.lt, a.p, M.params);
    M.mm.set(a.key, mm);
    const k = a.e + '|' + a.cat;
    const b = M.presup.get(k) || {e: a.e, cat: a.cat, presup: 0, vmax: 0, ejec: 0, n: 0};
    b.presup += mm.presup; b.vmax += mm.max * a.p; b.n++;
    M.presup.set(k, b);
  }
  for (const r of D.eje) {
    const b = M.presup.get(r[0] + '|' + r[1]);
    if (b && (!r[2] || r[2] === M.params.periodo)) b.ejec += r[3] || 0;
  }
  M.cats = [...new Set(M.art.map(a => a.cat))].sort();
  M.users = D.usr.map(r => ({id: r[0], nombre: r[1], rol: r[2], emp: r[3], puesto: r[4]}));
  M.userBy = new Map(M.users.map(u => [u.id, u]));
  M.matriz = D.mat.map(r => ({regla: r[0], desde: r[1], hasta: r[2], dentro: r[3], niveles: r[4], desc: r[5]}));
  M.hom = D.hom || {};
  M.ctaName = new Map(D.cta.map(r => [r[0], r[1]]));
  M.mcx = D.mcx;
  M.mcxKeys = new Set(D.mcx.map(r => r[1] + r[2] + r[3] + r[5] + r[6] + r[7] + r[0]));   // misma llave que VALIDACION del Anexo 1
  M.mcxBy = new Map();
  for (const r of D.mcx) { const k = r[0] + '|' + r[1]; if (!M.mcxBy.has(k)) M.mcxBy.set(k, []); M.mcxBy.get(k).push(r); }
  M.catcta = new Map(D.catcta.map(r => [r[0], {c6: r[1], c7: r[2], placa: r[3] === 'SI', obra: r[4] === 'SI', nota: r[5]}]));
  return M;
}

/* ---------- API desacoplada (contrato) ---------- */
class ExcelApi {

  async articulos() { return this.D.art; }
  async existencias() { return this.D.exi; }
  async consumo() { return this.D.con; }
  async presupuesto() { return {eje: this.D.eje, params: this.D.params}; }
  async usuarios() { return this.D.usr; }
  async matriz() { return this.D.mat; }
  async contable() { return {cta: this.D.cta, mcx: this.D.mcx, catcta: this.D.catcta, emp: this.D.emp}; }
  async homologacion() { return this.D.hom; }
  async postSolicitudCompra(rows) {          // escribe en la hoja SolicitudCompra_POST
    const S = this.state, docNums = {};
    for (const r of rows) {
      if (!docNums[r.Empresa]) docNums[r.Empresa] = 'SC-2026-' + pad(++S.seqDoc, 4);
      r.DocNum = docNums[r.Empresa];
    }
    S.post.push(...rows);
    return {ok: true, docNums};
  }
  static fromWorkbook(wb, XLSX) {
    const need = ['Parametros','Articulos','Existencias','Consumo_Trimestral','EjecucionPresupuesto','Usuarios','MatrizAprobacion','Cuentas_Contables','Matriz_Contable','CategoriaCuenta','Empresas'];
    const miss = need.filter(n => !wb.Sheets[n]);
    if (miss.length) throw new Error('Faltan hojas en el Excel: ' + miss.join(', '));
    const T = n => XLSX.utils.sheet_to_json(wb.Sheets[n], {defval: null});
    const pm = Object.fromEntries(T('Parametros').map(r => [r.Parametro, r.Valor]));
    const num = v => (v == null || v === '' ? 0 : Number(v));
    const D = {
      params: {Z: num(pm.NivelServicioZ), meses: num(pm.MesesCobertura), ltStd: num(pm.LeadTimeEstandarDias), ajuste: num(pm.AjustePrecioPct),
               margen: num(pm.MargenIntercompaniaPct), periodo: pm.PeriodoPresupuesto, dias: num(pm.DiasTrimestre)},
      emp: T('Empresas').map(r => [r.Empresa, r.NombreAnexo2]),
      art: T('Articulos').map(r => [r.Empresa, String(r.ItemCode), r.ItemName, r.Categoria, r.AreaUsuaria, r.ABC, num(r.PrecioProm_Q), num(r.LeadTimeDias), r.CodigoCorporativo]),
      exi: T('Existencias').map(r => [r.Empresa, String(r.ItemCode), num(r.Existencia), num(r.EnPedido), num(r.Comprometido)]),
      con: T('Consumo_Trimestral').map(r => [r.Empresa, String(r.ItemCode), num(r.T4_2025), num(r.T1_2026), num(r.T2_2026), num(r.T3_2026)]),
      eje: T('EjecucionPresupuesto').filter(r => r.Empresa).map(r => [r.Empresa, r.Categoria, r.Periodo, num(r.Ejecutado_Q)]),
      usr: T('Usuarios').map(r => [r.UserId, r.Nombre, r.Rol, r.Empresa, r.Puesto]),
      mat: T('MatrizAprobacion').filter(r => r.Regla).map(r => [r.Regla, num(r.MontoDesde_Q), num(r.MontoHasta_Q), r.DentroPresupuesto, r.NivelesRequeridos, r.Descripcion]),
      cta: T('Cuentas_Contables').map(r => [String(r['Número de cuenta']), r['Nombre de cuenta']]),
      mcx: T('Matriz_Contable').map(r => [String(r.Empresa).trim(), String(r.Cta), String(r.DIM1), String(r.DIM2), String(r.DIM3), String(r.DIM4), String(r.DIM5), String(r.PROYECTO),
            String(r.DEPARTAMENTO || ''), String(r['SUB-DEPARTAMENTO'] || ''), String(r['UBICACIÓN'] || ''), String(r['LINEA DE PRODUCTO'] || ''), String(r.PRODUCTO || ''), String(r['NOMBRE DEL PROYECTO'] || '')]),
      catcta: T('CategoriaCuenta').map(r => [r.Categoria, String(r.Cuenta6_Costo || ''), String(r.Cuenta7_Gasto || ''), r.RequierePlaca || 'NO', r.RequiereObra || 'NO', r.Nota || '']),
      hom: {}
    };
    if (wb.Sheets.Homologacion) {
      const g = {};
      for (const r of T('Homologacion')) (g[r.CodigoCorporativo] = g[r.CodigoCorporativo] || []).push([r.Empresa, String(r.CodigoLocal), r.DescripcionLocal, num(r.PrecioProm_Q)]);
      for (const k in g) if (new Set(g[k].map(x => x[0])).size > 1) D.hom[k] = g[k];
    }
    return new ExcelApi(D, 'Excel cargado por el usuario');
  }
}

/* Esqueleto para SAP B1 Service Layer: mismo contrato, NO probado contra un SAP real. */

/* ---------- reglas de inventario ---------- */
const stockOf = (M, key) => M.stock.get(key) || {ex: 0, ped: 0, com: 0};
const disponible = (M, key) => { const s = stockOf(M, key); return s.ex + s.ped - s.com; };
function abiertas(S, key) {
  let q = 0;
  for (const r of S.reqs) if (ABIERTOS.includes(r.estado)) for (const l of r.lines) if (l.emp + '|' + l.code === key) q += l.qty;
  return q;
}
const baseProy = (M, S, key, enCarrito = 0) => disponible(M, key) + abiertas(S, key) + enCarrito;
function sugerida(base, min, max, mult = 1) {
  if (max <= 0) return 0;
  let s = Math.max(0, Math.floor((max - base) / mult) * mult);
  if (s === 0 && base < min) s = mult;
  return s;
}
function alerta(base, qty, mm) {
  const sug = sugerida(base, mm.min, mm.max);
  if (mm.clase === 'Esporádico') return {tipo: 'Contra pedido', sug, exige: true, msg: 'Material de consumo esporádico: no tiene mínimo ni máximo. Indica para qué lo necesitas.'};
  const fin = base + qty;
  if (fin > mm.max || (sug === 0 && qty > 0)) return {tipo: 'Sobre máximo', sug, exige: true, msg: `Quedarías con ${fN(fin)} y el máximo es ${fN(mm.max)}. Usa la sugerida (${fN(sug)}) o justifica.`};
  if (fin < mm.min) return {tipo: 'Cantidad corta', sug, exige: false, msg: `Quedarías con ${fN(fin)}, por debajo del mínimo (${fN(mm.min)}).`};
  return {tipo: 'En rango', sug, exige: false, msg: `Quedarías con ${fN(fin)}, dentro del rango ${fN(mm.min)}–${fN(mm.max)}.`};
}
function cobertura(base, mm) { return mm.avg > 0 ? base / (mm.avg / 3) : null; }   // meses
function traslados(M, a, need) {     // otra empresa con disponible > máximo (mismo código corporativo)
  const out = [];
  for (const h of (M.hom[a.corp] || [])) {
    if (h[0] === a.e) continue;
    const k = h[0] + '|' + h[1], mm = M.mm.get(k); if (!mm || mm.max <= 0) continue;
    const ex = disponible(M, k) - mm.max;
    if (ex > 0) out.push({e: h[0], code: h[1], n: h[2], sobrante: ex, sug: Math.min(ex, Math.max(need, 0))});
  }
  return out;
}

/* ---------- presupuesto y aprobación ---------- */
function budgetInfo(M, S, e, cat, estados) {
  const b = M.presup.get(e + '|' + cat) || {presup: 0, ejec: 0, vmax: 0};
  let comp = 0;
  for (const r of S.reqs) if (r.emp === e && (estados || COMPROMETEN).includes(r.estado)) for (const l of r.lines) if (l.cat === cat) comp += l.total;
  return {presup: b.presup, ejec: b.ejec, vmax: b.vmax, comp, disp: b.presup - b.ejec - comp};
}
function evalBudget(M, S, e, lines) {
  const by = {};
  for (const l of lines) by[l.cat] = (by[l.cat] || 0) + l.qty * l.price;
  const cats = Object.keys(by).map(cat => {
    const b = budgetInfo(M, S, e, cat);
    return {cat, monto: by[cat], presup: b.presup, ejec: b.ejec, comp: b.comp, disp: b.disp, dentro: by[cat] <= b.disp + 0.005};
  });
  return {cats, dentro: cats.every(c => c.dentro), total: lines.reduce((a, l) => a + l.qty * l.price, 0)};
}
function rutaDe(M, total, dentro) {
  const r = M.matriz.find(m => (m.dentro === (dentro ? 'SI' : 'NO')) && total >= m.desde && total <= m.hasta)
         || M.matriz.find(m => m.dentro === 'CUALQUIERA') || M.matriz[M.matriz.length - 1];
  return {regla: r.regla, niveles: r.niveles, desc: r.desc};
}
const nivelTxt = n => n === 'AUTO' ? 'Aprobación automática' : n === 'N1' ? 'Aprobador N1' : 'Aprobadores N1 + N2';

/* ---------- contabilidad (Anexo 1 + Anexo 2) ---------- */
const anexoOf = (M, e) => M.anexoOf[e] || e;
function digitosDisponibles(M, e) { const a = anexoOf(M, e); return ['6', '7'].filter(d => (M.mcxBy.get(a + '|' + d) || []).length); }
function cuentaDefault(M, e, cat, pref) {
  const cc = M.catcta.get(cat) || {c6: '61300101', c7: '71304001'};
  const ds = digitosDisponibles(M, e);
  const want = pref || (cat === 'Papelería, oficina y cómputo' ? '7' : '6');
  const order = [want, want === '6' ? '7' : '6'].filter(d => ds.includes(d));
  for (const d of order) { const c = d === '6' ? cc.c6 : cc.c7; if (c) return c; }
  return cc.c6 || cc.c7 || '';
}
function centrosFor(M, e, cta) { return cta ? (M.mcxBy.get(anexoOf(M, e) + '|' + cta[0]) || []) : []; }
function centroLabel(r) { return `${r[8]} › ${r[9]} · ${r[10]} · ${r[11]}/${r[12]} · ${r[13]}`; }
function centroDefault(M, e, cta, cat) {
  const rows = centrosFor(M, e, cta); if (!rows.length) return null;
  const pref = /repuesto|herramient|ferreter|electric/i.test(cat) ? /repuestos/i : /empaque|materia prima|qu[ií]mic/i.test(cat) ? /insumos|materiales/i : /materiales|insumos/i;
  return rows.find(r => pref.test(r[9]) && /bodega/i.test(r[9])) || rows.find(r => /bodega/i.test(r[9])) || rows[0];
}
function contableFrom(M, e, cta, row, extra) {
  return Object.assign({cta, d1: row[2], d2: row[3], d3: row[4], d4: row[5], d5: row[6], proy: row[7], depN: row[8], subN: row[9], ubN: row[10], linN: row[11], prodN: row[12], proyN: row[13],
    detalle: '', placa: '', obraProc: '', obraEsp: ''}, extra || {});
}
const VEH = /llanta|neumatic|camion|pickup|vehicul|tractor|montacarga|motocicleta|carreta/i;
function reqPlaca(M, l) { const n = M.ctaName.get(l.ct.cta) || ''; return /VEHICULO/.test(n) || !!l.paraVeh; }
function reqObra(l) { return (l.ct.cta || '').startsWith('1210'); }
function validarLinea(M, e, l) {
  const c = l.ct;
  if (!c || !c.cta) return {ok: false, msg: 'Ingresar Cta Mayor'};
  if (!M.ctaName.has(c.cta)) return {ok: false, msg: 'La cuenta no existe en el Anexo 2'};
  if (!c.d1) return {ok: false, msg: 'Falta centro de costos'};
  const key = c.cta[0] + c.d1 + c.d2 + c.d4 + c.d5 + c.proy + anexoOf(M, e);
  if (!M.mcxKeys.has(key)) return {ok: false, msg: 'Información incorrecta: la combinación cuenta + centro de costos + proyecto no existe en la matriz', key};
  if (reqPlaca(M, l) && !String(c.placa).trim()) return {ok: false, msg: 'Falta la placa del vehículo', key};
  if (reqObra(l) && (!String(c.obraProc).trim() || !String(c.obraEsp).trim())) return {ok: false, msg: 'Faltan Nº de obra en proceso y Nº de obra específica', key};
  return {ok: true, msg: 'Correctamente', key};
}

/* ---------- solicitudes ---------- */
function newLine(M, S, e, code, qty, extra) {
  const a = M.artBy.get(e + '|' + code); if (!a) throw new Error('Artículo inexistente: ' + code);
  const mm = M.mm.get(a.key);
  const cta = cuentaDefault(M, e, a.cat);
  const row = centroDefault(M, e, cta, a.cat);
  const paraVeh = VEH.test(a.n) && a.cat.startsWith('Repuestos');
  let cta2 = cta;
  if (paraVeh) { const c = cta[0] + '1302807'; if (M.ctaName.has(c)) cta2 = c; }
  const row2 = cta2 === cta ? row : centroDefault(M, e, cta2, a.cat);
  return Object.assign({emp: e, code, name: a.n, cat: a.cat, price: a.p, qty, paraVeh, intento: 0, just: '',
    ct: row2 ? contableFrom(M, e, cta2, row2) : {cta: cta2, d1: '', d2: '', d3: '', d4: '', d5: '', proy: '', detalle: '', placa: '', obraProc: '', obraEsp: ''}}, extra || {});
}
function lineSnap(M, S, l) {      // foto de inventario/alerta al momento de pedir (se guarda en la solicitud)
  const k = l.emp + '|' + l.code, mm = M.mm.get(k);
  const base0 = disponible(M, k) + abiertas(S, k);
  const al = alerta(base0, l.qty, mm);
  return {disp: disponible(M, k), ab: abiertas(S, k), min: mm.min, max: mm.max, clase: mm.clase, sug: al.sug, alerta: al.tipo,
    total: +(l.qty * l.price).toFixed(2), evitado: l.intento > l.qty ? +((l.intento - l.qty) * l.price).toFixed(2) : 0};
}
function log(req, user, accion, detalle) { req.bit.push({ts: new Date().toISOString(), user, accion, detalle: detalle || ''}); }

function crearSolicitud(M, S, user, lines, opt) {
  opt = opt || {};
  const e = user.emp;
  const snaps = lines.map(l => Object.assign({}, l, lineSnap(M, S, l)));
  const bud = evalBudget(M, S, e, snaps);
  const ruta = rutaDe(M, bud.total, bud.dentro);
  const val = snaps.map(l => validarLinea(M, e, l));
  const req = {
    id: 'SOL-2026-' + pad(++S.seqReq, 4), emp: e, uid: user.id, solicitante: user.nombre, created: new Date().toISOString(),
    required: opt.required || addDays(15), tipoDoc: opt.tipoDoc || '', comentario: opt.comentario || '', lines: snaps,
    total: +bud.total.toFixed(2), bud, ruta, estado: 'Pendiente N1', bit: [], demo: !!opt.demo
  };
  log(req, user.nombre, 'Solicitud creada', `${snaps.length} línea(s), ${fQ(bud.total)}`);
  log(req, 'Sistema', 'Validación de presupuesto', bud.dentro ? 'Dentro de presupuesto en todas las categorías' :
    'Fuera de presupuesto: ' + bud.cats.filter(c => !c.dentro).map(c => `${c.cat} (pide ${fQ(c.monto)} vs disponible ${fQ(c.disp)})`).join('; '));
  log(req, 'Sistema', 'Validación contable (Anexo 2)', val.every(v => v.ok) ? `${snaps.length} línea(s) con combinación válida` : 'Hay líneas con información contable incorrecta');
  log(req, 'Sistema', `Ruta ${ruta.regla}`, nivelTxt(ruta.niveles));
  if (ruta.niveles === 'AUTO') { req.estado = 'Aprobada'; req.autoAt = new Date().toISOString(); log(req, 'Sistema', 'Aprobación automática', 'Dentro de presupuesto: pasa directo a Bodega'); }
  else log(req, 'Sistema', 'Pendiente N1', 'Enviada al gerente de la empresa');
  S.reqs.push(req);
  return req;
}
function aprobar(M, S, req, user, comentario) {
  if (req.estado === 'Pendiente N1' && user.rol === 'Aprobador N1' && user.emp === req.emp) {
    log(req, user.nombre, 'Aprobó N1', comentario);
    if (req.ruta.niveles === 'N1+N2') { req.estado = 'Pendiente N2'; log(req, 'Sistema', 'Escalamiento a N2', `Total ${fQ(req.total)}: requiere Dirección de Operaciones`); }
    else { req.estado = 'Aprobada'; req.apprAt = new Date().toISOString(); }
    return true;
  }
  if (req.estado === 'Pendiente N2' && user.rol === 'Aprobador N2') {
    log(req, user.nombre, 'Aprobó N2', comentario); req.estado = 'Aprobada'; req.apprAt = new Date().toISOString(); return true;
  }
  return false;
}
function rechazar(M, S, req, user, comentario) {
  if (!String(comentario || '').trim()) throw new Error('Rechazar exige un comentario');
  const okN1 = req.estado === 'Pendiente N1' && user.rol === 'Aprobador N1' && user.emp === req.emp;
  const okN2 = req.estado === 'Pendiente N2' && user.rol === 'Aprobador N2';
  if (!okN1 && !okN2) return false;
  log(req, user.nombre, 'Rechazó ' + (okN1 ? 'N1' : 'N2'), comentario); req.estado = 'Rechazada'; return true;
}
function pendientesDe(S, user) {
  return S.reqs.filter(r => (user.rol === 'Aprobador N1' && r.estado === 'Pendiente N1' && r.emp === user.emp) || (user.rol === 'Aprobador N2' && r.estado === 'Pendiente N2'));
}
function resueltasDe(S, user) {
  const tag = user.rol === 'Aprobador N1' ? 'N1' : 'N2';
  return S.reqs.filter(r => r.bit.some(b => b.user === user.nombre && /^(Aprobó|Rechazó)/.test(b.accion)));
}


function seedDemo(M, S) {      // escenarios con datos reales del Excel v2 (SUPREMA y PALMAS)
  const U = id => M.userBy.get(id);
  const mk = (uid, items) => { const u = U(uid); return crearSolicitud(M, S, u, items.map(([c, q]) => newLine(M, S, u.emp, c, q)), {demo: true, comentario: 'Escenario de demo'}); };
  mk('U01', [['RE0302046', 7]]);        // cojinete 6309: dentro de presupuesto -> R1 automática
  mk('U01', [['RE0301029', 8]]);        // refrigerante: excede presupuesto y > Q10,000 -> R3
  mk('U01', [['RE0101025', 10]]);       // filtro diésel: presupuesto ya excedido, <= Q10,000 -> R2
  mk('U02', [['MA0101022', 193]]);      // guantes de cuero (PALMAS) -> R2
  const d = mk('U02', [['MA0105017', 126485]]);   // diésel (PALMAS) -> R3; N1 aprueba y queda en N2

/* ---------- consolidación Bodega -> SAP ---------- */
function consolidar(S, ids) {
  const g = new Map();
  for (const r of S.reqs) if (ids.includes(r.id) && r.estado === 'Aprobada') for (const l of r.lines) {

    out.push({e: b.e, cat: b.cat, cuenta: familia(M, b.cat), presup: bi.presup, ejec: bi.ejec, comp: bi.comp, disp: bi.disp, uso, n: b.n});

function dashAgrupar(rows, modo) {

function vHist(u){
  const rs=PJ.resueltasDe(S,u).slice().reverse();
  return rs.length?rs.map(r=>{const b=r.bit.filter(x=>x.user===u.nombre&&/^(Aprobó|Rechazó)/.test(x.accion)).pop();return `<div class="pc" data-act="open" data-id="${r.id}"><div class="a"><div><span class="emp">${esc(r.emp)}</span><div style="font-weight:700;margin-top:6px">${r.id}</div><div class="small muted">${esc(b.accion)} · ${fDT(b.ts)}</div></div><div class="amt">${fS(r.total)}</div></div><div class="chips"><span class="chip ${chipE(r.estado)}">${r.estado}</span></div></div>`;}).join(''):'<div class="card empty">Todavía no has aprobado ni rechazado solicitudes.</div>';
}
function vPres(u){
  const d=ui.dash;if(u.rol===N1)d.emp=u.emp;
  const emps=[...new Set([...M.presup.values()].map(b=>b.e))].sort(),cuentas=[...new Set(M.cats.map(c=>PJ.familia(M,c)))].filter(Boolean);
  const f={emp:d.emp,cat:d.cat,cuenta:d.cuenta,minUso:d.minUso};if(u.rol===N1)f.emps=[u.emp];
  const rows=PJ.dashFiltrar(M,S,f),T=rows.reduce((a,r)=>({p:a.p+r.presup,e:a.e+r.ejec,c:a.c+r.comp,d:a.d+r.disp}),{p:0,e:0,c:0,d:0}),uso=T.p>0?(T.e+T.c)/T.p:0;
  const gr=PJ.dashAgrupar(rows,d.modo).sort((a,b)=>b.uso-a.uso).slice(0,25);
  const sel=(k,opts)=>`<select data-chg="dflt" data-k="${k}">${opts.map(o=>`<option value="${esc(o[0])}" ${d[k]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  const lab=k=>d.modo==='cuenta'?k+' · '+(M.ctaName.get(k)||'').replace(/-COSTO$|-GASTO$/,''):k;
  return `<div class="fl">${u.rol===N1?`<select disabled><option>${esc(u.emp)}</option></select>`:sel('emp',[['Todas','Todas las empresas'],...emps.map(e=>[e,e])])}${sel('cat',[['Todas','Todas las categorías'],...M.cats.map(c=>[c,c])])}${sel('cuenta',[['Todas','Todas las cuentas'],...cuentas.map(c=>[c,c+' · '+(M.ctaName.get(c)||'').replace(/-COSTO$/,'')])])}</div>
  <div class="seg" style="display:flex;background:var(--soft);border-radius:99px;padding:3px;margin-bottom:12px">${[['cat','Categoría'],['emp','Empresa'],['cuenta','Cuenta']].map(m=>`<button style="flex:1;border:0;border-radius:99px;padding:8px;font-weight:700;font-size:12.5px;background:${d.modo===m[0]?'var(--g800)':'transparent'};color:${d.modo===m[0]?'#fff':'var(--muted)'}" data-act="dmodo" data-v="${m[0]}">${m[1]}</button>`).join('')}</div>
  <div class="kp2"><div class="kpi hl"><div class="l">Presupuesto</div><div class="v">${fS(T.p)}</div></div><div class="kpi ${T.d<0?'':'lm'}" ${T.d<0?'style="background:var(--dangerbg);border-color:var(--danger)"':''}><div class="l">Disponible</div><div class="v">${fS(T.d)}</div></div>
   <div class="kpi"><div class="l">Ejecutado</div><div class="v">${fS(T.e)}</div></div><div class="kpi"><div class="l">Comprometido</div><div class="v">${fS(T.c)}</div></div></div>
  <div class="gbar"><div class="t"><span>Consumo total</span><b>${fP(uso)}</b></div><div class="meter"><i class="${uso>1?'m-bad':'m-ej'}" style="width:${Math.min(uso,1)*100}%"></i></div></div>
  <div class="sec"><span>Por ${d.modo==='cat'?'categoría':d.modo==='emp'?'empresa':'cuenta'}</span><span class="small muted">${rows.length} categorías</span></div>
  ${gr.length?gr.map(g=>{const tot=Math.max(g.presup,g.ejec+g.comp,1);return `<div class="gbar" data-act="drill" data-k="${esc(g.k)}"><div class="t"><span>${esc(lab(g.k))}</span><b style="${g.uso>1?'color:var(--danger)':''}">${fP(g.uso)}</b></div>
   <div class="meter" style="position:relative;${g.uso>1?'outline:2px solid var(--danger)':''}"><i class="m-ej" style="width:${g.ejec/tot*100}%"></i><i class="m-co" style="width:${g.comp/tot*100}%"></i></div>
   <div class="tiny muted" style="margin-top:5px;display:flex;justify-content:space-between"><span>Pres. ${fS(g.presup)}</span><span>Disp. ${fS(g.disp)}</span></div></div>`;}).join(''):'<div class="card empty">Sin resultados con esos filtros.</div>'}
  <div class="legend" style="margin-top:8px"><span><b style="background:var(--g800)"></b>Ejecutado</span><span><b style="background:var(--oro)"></b>Comprometido</span></div>`;
}
function vYo(u){
  return `<div class="card"><div class="row"><span class="av" style="width:48px;height:48px;font-size:20px">${esc(u.nombre[0])}</span><div><b>${esc(u.nombre)}</b><div class="small muted">${esc(u.rol)} · ${esc(u.emp)} · ${esc(u.puesto)}</div></div></div>
   <div class="row" style="margin-top:14px"><button class="btn ghost grow" data-act="logout">Cambiar de usuario</button><button class="btn ghost" data-act="theme">Tema</button></div></div>
  <div class="card"><h4>Datos de esta demo</h4><p class="small muted">Las solicitudes se guardan en este navegador. Si abres esta app desde el mismo sitio que la versión de escritorio, verás lo mismo en tiempo real.</p>
   <div class="row"><button class="btn d" data-act="sync">${ic('refresh')} Actualizar</button><button class="btn p" data-act="seed">Precargar escenarios</button></div></div>
  <div class="card"><h4>Claude</h4><p class="small">Estado: <b>${esc(Claude.status)}</b>. Genera el resumen de riesgos de cada solicitud; sin conexión usa un motor local rotulado.</p>
   <label class="f">API key (solo fuera de Claude)</label><input type="password" value="${esc(S.set.apiKey||'')}" data-chg="apikey" placeholder="sk-ant-…" autocomplete="off"></div>`;
}
function sheetHTML(r,u){
  if(!r)return '';
  const canAct=(r.estado==='Pendiente N1'&&u.rol===N1&&u.emp===r.emp)||(r.estado==='Pendiente N2'&&u.rol===N2);
  return `<div class="sheet"><div class="sh-h"><button class="bk" data-act="close">${ic('back')}</button><div><div style="font-family:var(--fh);font-weight:800;font-size:18px">${r.id}</div><div class="tiny" style="color:var(--sage2)">${esc(r.solicitante)} · ${esc(PJ.anexoOf(M,r.emp))}</div></div><div class="amt" style="margin-left:auto;font-family:var(--fh);font-weight:800;font-size:21px">${fS(r.total)}</div></div>
  <div class="sh-b"><div class="chips" style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip ${chipE(r.estado)}">${r.estado}</span><span class="chip dark">Ruta ${r.ruta.regla} · ${PJ.nivelTxt(r.ruta.niveles)}</span><span class="chip ${r.bud.dentro?'ok':'bad'}">${r.bud.dentro?'Con presupuesto':'Sin presupuesto'}</span></div>
   <div class="small muted" style="margin-top:8px">Creada ${fDT(r.created)} · requerida ${fD(r.required)}${r.tipoDoc?' · '+esc(r.tipoDoc):''}</div>${r.comentario?`<div class="small" style="margin-top:4px">“${esc(r.comentario)}”</div>`:''}
   <div class="row" style="margin-top:12px"><button class="btn claude" style="width:100%;min-height:48px;border-radius:16px" data-act="resumen" data-id="${r.id}">${ic('spark')} Resumen con Claude</button></div><div id="aiRes" style="margin-top:10px"></div>
   <div class="sec"><span>Líneas (${r.lines.length})</span></div>
   ${r.lines.map(l=>`<div class="ln"><div class="nm">${esc(l.name)}</div><div class="tiny muted">${esc(l.code)} · ${esc(l.cat)}</div>
    <div class="mini"><div>Pide<b>${fN(l.qty)}</b></div><div>Sugerido<b>${fN(l.sug)}</b></div><div>Disponible<b>${fN(l.disp)}</b></div><div>Mín/Máx<b>${fN(l.min)}/${fN(l.max)}</b></div></div>
    <div class="row" style="margin-top:8px;justify-content:space-between"><span class="chip ${chipA(l.alerta)}">${l.alerta}</span><b class="mono">${fQ(l.total)}</b></div>${l.just?`<div class="small" style="margin-top:6px">“${esc(l.just)}”</div>`:''}</div>`).join('')}
   <div class="sec"><span>Presupuesto</span></div>${r.bud.cats.map(c=>`<div class="gbar"><div class="t"><span>${esc(c.cat)}</span><span class="chip ${c.dentro?'ok':'bad'}">${c.dentro?'Dentro':'Excede'}</span></div><div class="small muted">Pide ${fQ(c.monto)} · disponible ${fQ(c.disp)}${c.dentro?'':' · excede por '+fQ(c.monto-Math.max(c.disp,0))}</div></div>`).join('')}
   <div class="sec"><span>Imputación contable</span></div>${r.lines.map(l=>`<div class="gbar"><div class="t"><span>${esc(l.ct.cta)}</span>${(()=>{const v=PJ.validarLinea(M,r.emp,l);return v.ok?'<span class="chip ok">✅ Correcta</span>':'<span class="chip bad">❌ Incorrecta</span>';})()}</div><div class="tiny muted">${esc(M.ctaName.get(l.ct.cta)||'')}<br>${esc(l.ct.depN)} › ${esc(l.ct.subN)} · ${esc(l.ct.proy)}</div></div>`).join('')}
   <div class="sec"><span>Bitácora</span></div><div class="bit">${r.bit.map(b=>`<div class="${b.user==='Sistema'?'sys':''}"><span class="w">${fDT(b.ts)} · ${esc(b.user)}</span><br><b>${esc(b.accion)}</b>${b.detalle?' — '+esc(b.detalle):''}</div>`).join('')}</div></div>
  ${canAct?`<div class="sh-f"><div class="row" style="flex-wrap:nowrap"><button class="btn bad" data-act="ask" data-t="rechazar" data-id="${r.id}">${ic('x')} Rechazar</button><button class="btn p" data-act="ask" data-t="aprobar" data-id="${r.id}">${ic('check')} Aprobar</button></div></div>`:''}</div>`;
}
function confHTML(){
  const c=ui.conf,r=S.reqs.find(x=>x.id===c.id),ap=c.t==='aprobar';
  return `<div class="ov" data-act="ovc"><div><h3>${ap?'¿Aprobar':'¿Rechazar'} ${r.id}?</h3><p class="muted small">${fQ(r.total)} · ${esc(r.solicitante)} · ${esc(r.emp)}${ap&&r.ruta.niveles==='N1+N2'&&cur().rol===N1?'<br><b>Pasará a N2 (Dirección de Operaciones).</b>':''}</p>
   <label class="f">Comentario ${ap?'(opcional)':'(obligatorio)'}</label><textarea id="mc" placeholder="${ap?'Ej.: de acuerdo':'Motivo del rechazo'}"></textarea>
   <div class="row" style="margin-top:12px;flex-wrap:nowrap"><button class="btn ghost" style="flex:1;min-height:48px" data-act="cancel">Cancelar</button><button class="btn ${ap?'p':'bad'}" style="flex:1;min-height:48px" data-act="confirm">${ap?'Aprobar':'Rechazar'}</button></div></div></div>`;
}
/* ---------- acciones ---------- */
const A={},C={};
A.tab=el=>{ui.tab=el.dataset.id;ui.sheet=null;render();};
A.login=el=>{S.user=el.dataset.id;lsSet('pj.user.mobile',S.user);save();ui.tab='pend';render();};
A.logout=()=>{S.user='';lsSet('pj.user.mobile','');save();render();};
A.theme=()=>{const r=document.documentElement,dk=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('pj.theme',r.dataset.theme)}catch(e){}};
A.sync=()=>{PJ.syncState(S);render();toast('Datos actualizados');};
A.seed=()=>{if(S.demo&&!confirm('Ya precargaste los escenarios. ¿Agregarlos otra vez?'))return;PJ.seedDemo(M,S);save();render();toast('Escenarios cargados');};
A.open=el=>{ui.sheet=el.dataset.id;render();};
A.close=()=>{ui.sheet=null;render();};
A.ask=el=>{ui.conf={t:el.dataset.t,id:el.dataset.id};render();setTimeout(()=>{const t=$('#mc');if(t)t.focus();},50);};
A.cancel=()=>{ui.conf=null;render();};
A.ovc=(el,e)=>{if(e.target===el)A.cancel();};
A.confirm=()=>{
  const c=ui.conf,u=cur(),r=S.reqs.find(x=>x.id===c.id),cm=($('#mc')||{}).value||'';
  try{const ok=c.t==='aprobar'?PJ.aprobar(M,S,r,u,cm):PJ.rechazar(M,S,r,u,cm);
    if(!ok){toast('No tienes permiso sobre esta solicitud');return;}
    save();ui.conf=null;ui.sheet=null;render();toast(c.t==='aprobar'?(r.estado==='Pendiente N2'?`${r.id} aprobada y escalada a N2`:`${r.id} aprobada ✅`):`${r.id} rechazada`);}
  catch(e){toast(e.message);}
};
A.resumen=async el=>{
  const r=S.reqs.find(x=>x.id===el.dataset.id),box=$('#aiRes');
  box.innerHTML='<div class="ai"><div class="tag">✨ Claude</div>Leyendo la solicitud…</div>';
  await PJ.resumenClaude(M,r,(t,local)=>{box.innerHTML=`<div class="ai ${local?'local':''}"><div class="tag">${ic('spark')} ${local?'Motor local · sin conexión a Claude':'Claude · resumen para el aprobador'}</div>${fmt(t)}</div>`;});
};
A.dmodo=el=>{ui.dash.modo=el.dataset.v;render();};
A.drill=el=>{const d=ui.dash,k=el.dataset.k;if(d.modo==='cat')d.cat=k;else if(d.modo==='cuenta')d.cuenta=k;else if(cur().rol!==N1)d.emp=k;render();};
C.dflt=el=>{ui.dash[el.dataset.k]=el.value;render();};
C.apikey=el=>{S.set.apiKey=el.value.trim();save();toast('API key guardada en este navegador');};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&C[el.dataset.chg])C[el.dataset.chg](el,e);});
window.__PJ_DBG={A,C,ui,render,get S(){return S},get M(){return M}};
boot();
})();
</script></body></html>
